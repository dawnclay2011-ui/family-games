  }
  if (looksLikeMissingExponent(s, p)) {
    var extra = wrongFactorNote(s, p);
    return { ok: false, code: "exponent", message: "The exponent is missing. " + exponentExample() + (extra ? " " + extra : "") };
  }
  if (exponentOnInitial(s, p.initial)) {
    return { ok: false, code: "base", message: "The exponent goes on the factor, not on the starting amount alone. " + exponentExample() };
  }
  var note = wrongFactorNote(s, p);
  if (!note && fn) {
    var wrongs = p.wrongFactors || [];
    for (var i = 0; i < wrongs.length; i++) {
      var wf = compileExpr(String(p.initial) + "*(" + wrongs[i].factor + ")^" + p.variable, p.variable);
      if (wf && sameFn(fn, wf)) { note = wrongs[i].note; break; }
    }
  }
  if (note) return { ok: false, code: "factor", message: note };
  var pct = percentIntegerNote(s, p);
  if (pct) return { ok: false, code: "factor", message: pct };
  if (!fn) return { ok: false, code: "invalid", message: MODEL_INVALID };
  return { ok: false, code: "wrong", message: "Not the model yet. You need the starting value, the factor, and the exponent on the factor. " + exponentExample() };
}
function checkAnswer(problem, raw) {
  if (problem.kind === "number") return classifyNumber(raw, problem);
  return classifyModel(raw, problem);
}
function answerKey(p) {
  if (p.kind === "number") { ensureNumber(p); return p.text; }
  return modelKey(p);
}
PROBLEMS.forEach(ensureNumber);
globalThis.FoodTruckReview = {
  PROBLEMS: PROBLEMS,
  checkAnswer: checkAnswer,
  classifyNumber: classifyNumber,
  classifyModel: classifyModel,
  answerKey: answerKey,
  roundedNumber: roundedNumber
};

/* ---------- page ---------- */
var KEY = PREVIEW ? "tycoonReviewPreview" : "tycoonReview";
var NP = PROBLEMS.length;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function fresh(keep) {
  return {
    v: 1, stage: "brief", idx: 0,
    results: PROBLEMS.map(function () { return { tries: 0, ok: false, answers: [], hint: false, codes: [] }; }),
    startedAt: null, finishedAt: null,
    autoSent: keep ? !!keep.autoSent : false,
    lastDone: keep ? keep.lastDone || null : null,
    runs: keep ? keep.runs || 0 : 0
  };
}
var st = null;
function loadState() {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { saved = null; }
  if (!saved || saved.v !== 1 || !saved.results || saved.results.length !== NP) st = fresh(saved);
  else st = saved;
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
  showHead();
}
function showHead() {
  var el = document.getElementById("best");
  if (el) el.textContent = "Review shift · Practice";
}
var app;
function toTop(){ try { window.scrollTo(0, 0); } catch (e) {} }
function correctCount() { return st.results.filter(function (r) { return r.ok; }).length; }
function render() {
  if (st.stage === "brief") return brief();
  if (st.stage === "work") return problem();
  return done();
}
function brief() {
  app.innerHTML = '<div class="panel"><span class="tag">Review shift · Practice</span>' +
    '<h2 style="margin-top:8px">Keep the decimals. Write the whole model.</h2>' +
    '<p>Two skills from Shift 9 (followers and equipment) are worth another pass. New numbers, same truck.</p>' +
    '<ul><li><b>Precision.</b> When a quantity grows or shrinks by a percent over several steps, keep every decimal until the end. Round only the final answer.</li>' +
    '<li><b>The model.</b> Writing an exponential model means the exponent is on the factor: a(b)^t. Example: V(t) = 40000(0.85)^t.</li></ul>' +
    '<div class="stake"><b>Goal:</b> get all 6 problems right. Unlimited tries on each one. A hint is on every problem — open it when you want it. This is practice. It does not award credit. There is no timer.</div>' +
    '<button id="start" type="button" onclick="startReview()">Start the review</button></div>';
}
function startReview() {
  if (!st.startedAt) st.startedAt = new Date().toISOString();
  st.stage = "work";
  st.idx = 0;
  persist();
  render();
  toTop();
}
function statsHTML() {
  return '<div class="stats">' +
    '<div class="stat"><div class="k">Correct</div><div class="v">' + correctCount() + ' / ' + NP + '</div></div>' +
    '<div class="stat"><div class="k">Problem</div><div class="v">' + (st.idx + 1) + ' of ' + NP + '</div></div>' +
    '<div class="stat"><div class="k">Tries</div><div class="v">Unlimited</div></div></div>' +
    '<p class="muted" style="margin:8px 0 0">Goal: all 6 correct. Practice, not credit.</p>';
}
function problem() {
  var i = st.idx, p = PROBLEMS[i], r = st.results[i];
  var last = r.answers.length ? r.answers[r.answers.length - 1] : "";
  var prior = "";
  if (!r.ok && last) {
    var again = checkAnswer(p, last);
    if (!again.ok && again.code !== "empty") prior = again.message;
  }
  var note = p.kind === "model"
    ? "Type ^ for the exponent. 40000(0.85)^t and 40000*0.85^t both work, with or without spaces."
    : "A dollar sign, commas, and a trailing zero are fine. Round only at the end.";
  var inputMode = p.kind === "number" ? "decimal" : "text";
  app.innerHTML = '<div class="panel">' + statsHTML() + '</div>' +
    '<div class="panel" id="taskp"><span class="tag">Problem ' + (i + 1) + ' of ' + NP + ' · ' + esc(p.title) + '</span>' +
    '<p id="q" style="font-size:1.05rem">' + esc(p.q) + '</p>' +
    '<div class="stake">' + esc(p.why) + '</div>' +
    (r.ok
      ? '<p>Your answer: <b>' + esc(last) + '</b></p><div class="note"><b class="good">' + esc(checkAnswer(p, last).message) + '</b></div><button id="next" type="button" onclick="nextProblem()">' + (i + 1 < NP ? "Next problem" : "Finish the review") + '</button>'
      : '<div class="row">' + (p.prefix ? '<span class="pre">' + esc(p.prefix) + '</span>' : '') +
        '<input class="ans" id="ans" type="text" inputmode="' + inputMode + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + esc(p.ph) + '" value="' + esc(last) + '" aria-label="Your answer" onkeydown="if(event.key===\'Enter\')commitAnswer()">' +
        '<button id="go" type="button" onclick="commitAnswer()">Check</button></div>' +
        '<div class="muted" id="fmt" style="margin-top:6px">' + esc(note) + '</div>' +
        '<div class="row"><button id="hintbtn" type="button" class="sec" onclick="openHint()"' + (r.hint ? " disabled" : "") + '>' + (r.hint ? "Hint open" : "Show hint") + '</button></div>' +
        '<div class="note" id="hintbox"' + (r.hint ? "" : " hidden") + '><b>Hint.</b> ' + esc(p.hint) + '</div>' +
        '<div class="note" id="fb" role="status" aria-live="polite"' + (prior ? "" : " hidden") + '>' + (prior ? '<b class="bad">' + esc(prior) + '</b>' : "") + '</div>') +
    '</div>';
  var inp = document.getElementById("ans");
  if (inp) inp.focus();
}
function openHint() {
  var r = st.results[st.idx];
  r.hint = true;
  persist();
  var box = document.getElementById("hintbox");
  if (box) box.hidden = false;
  var btn = document.getElementById("hintbtn");
  if (btn) { btn.disabled = true; btn.textContent = "Hint open"; }
}
function showFb(message, ok) {
  var fb = document.getElementById("fb");
  if (!fb) return;
  fb.hidden = false;
  fb.innerHTML = '<b class="' + (ok ? "good" : "bad") + '">' + esc(message) + '</b>';
}
function commitAnswer() {
  var i = st.idx, p = PROBLEMS[i], r = st.results[i];
  if (r.ok) return;
  var input = document.getElementById("ans");
  if (!input) return;
  var raw = input.value.trim().slice(0, 200);
  var res = checkAnswer(p, raw);
  if (res.code === "empty") { showFb(res.message, false); return; }
  r.tries++;
  r.answers.push(raw);
  if (res.code && res.code !== "ok" && r.codes.indexOf(res.code) < 0) r.codes.push(res.code);
  if (res.ok) {
    r.ok = true;
    persist();
    problem();
    var el = document.getElementById("taskp");
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "start" });
    return;
  }
  persist();
  showFb(res.message, false);
}
function nextProblem() {
  if (!st.results[st.idx].ok) return;
  if (st.idx + 1 < NP) { st.idx++; persist(); render(); toTop(); return; }
  finish();
}
function finish() {
  st.stage = "done";
  st.finishedAt = new Date().toISOString();
  st.runs = (st.runs || 0) + 1;
  st.lastDone = {
    startedAt: st.startedAt,
    finishedAt: st.finishedAt,
    run: st.runs,
    correct: correctCount(),
    results: st.results.map(function (r) {
      return { tries: r.tries, ok: r.ok, answers: r.answers.slice(), hint: !!r.hint, codes: r.codes.slice() };
    })
  };
  persist();
  render();
  toTop();
}
function codeLabel(code) {
  return {
    early: "targeted hint: rounded too early",
    exponent: "targeted hint: missing exponent",
    factor: "hint: check the factor (growth vs decay)",
    base: "hint: exponent goes on the factor",
    finer: "hint: round the final answer",
    coarser: "hint: rounded farther than asked",
    steps: "hint: wrong number of steps",
    invalid: "a try could not be read",
    wrong: "general miss"
  }[code] || code;
}
function done() {
  var L = st.lastDone;
  if (!L) { st.stage = "brief"; return render(); }
  var rows = PROBLEMS.map(function (p, i) {
    var r = L.results[i];
    return "<tr><td>" + (i + 1) + "</td><td>" + esc(p.title) + "</td><td>" + r.tries + "</td><td>" + (r.hint ? "Yes" : "—") + "</td></tr>";
  }).join("");
  app.innerHTML = '<div class="panel"><h2>Review complete</h2>' +
    '<p>You got <b>all ' + NP + ' problems</b> right.</p>' +
    '<p class="muted">This was practice. It does not award credit.</p>' +
    '<table><tr><th>#</th><th>Problem</th><th>Tries</th><th>Hint</th></tr>' + rows + '</table>' +
    reportBtn("reviewReport", "📨 Send review report to Mom") +
    '<div class="nextshift">This practice review stands on its own. It does not open another shift.<br><br><a href="../' + PREVIEW_QS + '">Back to the main game (Food Truck Season)</a></div>' +
    '<p><button class="sec" type="button" onclick="practiceAgain()">Practice this review again</button></p></div>';
  if (!PREVIEW && !st.autoSent) {
    st.autoSent = true;
    persist();
    var b = document.querySelector("button.rep");
    if (b) reportToMom(b, reviewReport);
  }
}
function practiceAgain() {
  if (!confirm("Practice this review again? The problems start over. A report already sent stays sent.")) return;
  st = fresh(st);
  persist();
  render();
  toTop();
}

/* ---- Report to Mom (FormSubmit AJAX) — same mechanism as the daily shifts ---- */
var MOM_EMAIL = "8caedc1e9653325b52b367e2e172d2a3";
var REPORT_URL = "https://formsubmit.co/ajax/" + MOM_EMAIL;
function nowStr(){try{return new Date().toLocaleString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"});}catch(e){return new Date().toString();}}
function fmtTime(iso){ if(!iso) return "—"; try{return new Date(iso).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"});}catch(e){return iso;} }
function postReport(fields){
  var ctl=typeof AbortController!=="undefined"?new AbortController():null;
  var t=ctl?setTimeout(function(){ctl.abort();},15000):null;
  return fetch(REPORT_URL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(fields),signal:ctl?ctl.signal:undefined})
    .then(function(r){return r.json().catch(function(){return {success:r.ok?"true":"false",message:"HTTP "+r.status};}).then(function(j){j._status=r.status;return j;});})
    .finally(function(){if(t)clearTimeout(t);});
}
function reportBtn(builder,label,small){
  if(PREVIEW) return '<div class="report"><button type="button" class="rep'+(small?" small":"")+'" disabled>📨 Reports off (preview)</button><span class="rstat">Preview – reports off</span></div>';
  return '<div class="report"><button type="button" class="rep'+(small?" small":"")+'" onclick="reportToMom(this,'+builder+')">'+label+'</button><span class="rstat" role="status" aria-live="polite"></span></div>';
}
/*BACKUP_SENDER_v1*/
var MOM_MAILTO = "dawnclay2011@gmail.com";
function reportText(f){return Object.keys(f).filter(function(k){return k[0]!=="_";}).map(function(k){return k+": "+(typeof f[k]==="object"?JSON.stringify(f[k]):f[k]);}).join("\n");}
function retryReport(fields){
  var body=new URLSearchParams();
  Object.keys(fields).forEach(function(k){body.append(k,typeof fields[k]==="object"?JSON.stringify(fields[k]):String(fields[k]));});
  return fetch(REPORT_URL,{method:"POST",headers:{"Accept":"application/json"},body:body}).then(function(r){return r.json();}).then(function(j){if(String(j.success)!=="true")throw new Error(j.message||"retry failed");return j;});
}
function formPost(fields){try{
  var fr=document.getElementById("bkFrame");
  if(!fr){fr=document.createElement("iframe");fr.name=fr.id="bkFrame";fr.style.display="none";document.body.appendChild(fr);}
  var fm=document.createElement("form");fm.method="POST";fm.action="https://formsubmit.co/"+MOM_EMAIL;fm.target="bkFrame";fm.style.display="none";
  Object.keys(fields).forEach(function(k){var i=document.createElement("input");i.type="hidden";i.name=k;i.value=typeof fields[k]==="object"?JSON.stringify(fields[k]):String(fields[k]);fm.appendChild(i);});
  document.body.appendChild(fm);fm.submit();setTimeout(function(){fm.remove();},5000);
}catch(e){}}
function backupPanel(btn,fields){
  var host=btn.parentNode;if(host.querySelector(".bkp"))return;
  var txt=(fields._subject||"Game Report")+"\n\n"+reportText(fields);
  var p=document.createElement("div");p.className="bkp";p.style.cssText="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center";
  var sub=encodeURIComponent(fields._subject||"Game Report");var b=txt;if(b.length>1800)b=b.slice(0,1800)+"\n…(cut short — tap Copy report and paste the rest)";
  function mk(l,fn){var x=document.createElement("button");x.type="button";x.className="alt small";x.textContent=l;x.onclick=fn;p.appendChild(x);return x;}
  mk("✉️ Send to Mom by email",function(){location.href="mailto:"+MOM_MAILTO+"?subject="+sub+"&body="+encodeURIComponent(b);});
  var cp=mk("📋 Copy report",function(){var ok=function(){cp.textContent="Copied! ✅";};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,function(){fallbackCopy(txt,ok);});else fallbackCopy(txt,ok);});
  if(navigator.share)mk("📤 Share report",function(){navigator.share({title:fields._subject||"Game Report",text:txt}).catch(function(){});});
  var n=document.createElement("div");n.style.cssText="width:100%;font-size:.85em";n.textContent="Backup: email or copy your report to Mom, or tap Try again.";p.appendChild(n);
  host.appendChild(p);
}
function fallbackCopy(t,ok){try{var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();ok();}catch(e){prompt("Copy this report:",t);}}
function reportToMom(btn,build){
  var statusEl=btn.nextElementSibling;
  if(PREVIEW){btn.disabled=true;statusEl.textContent="Preview – reports off";return;}
  if(btn.dataset.sent||btn.disabled)return;
  if(navigator.onLine===false){statusEl.className="rstat bad";statusEl.textContent="No internet — try again later.";btn.textContent="🔁 Try again";return;}
  var fields;
  try{fields=Object.assign({_subject:REPORT_SUBJECT,_template:"box",_captcha:"false",Date:nowStr(),Player:REPORT_PLAYER,Game:REPORT_GAME},build());}
  catch(e){statusEl.className="rstat bad";statusEl.textContent="Oops — couldn't build the report.";return;}
  btn.disabled=true;btn.textContent="Sending… 📤";statusEl.className="rstat";statusEl.textContent="";
  postReport(fields).then(function(j){
    if(String(j.success)!=="true")throw new Error(j.message||"Send failed");
    btn.dataset.sent="1";btn.textContent="Sent! ✅";btn.classList.add("sent");statusEl.className="rstat good";statusEl.textContent="Report sent to Mom.";
  }).catch(function(e){
    if(navigator.onLine!==false&&!/activat/i.test(e&&e.message||"")&&!btn.dataset.retried){
      btn.dataset.retried="1";btn.textContent="Trying another way… 📤";
      return retryReport(fields).then(function(){
        btn.dataset.sent="1";btn.disabled=true;btn.textContent="Sent! ✅";btn.classList.add("sent");statusEl.className="rstat good";statusEl.textContent="Mom got your report!";
      }).catch(function(e2){formPost(fields);bkFail(btn,statusEl,fields,e2);});
    }
    bkFail(btn,statusEl,fields,e);
  });
}
function bkFail(btn,statusEl,fields,e){
  backupPanel(btn,fields);
  btn.disabled=false;btn.textContent="🔁 Try again";statusEl.className="rstat bad";
  statusEl.textContent=navigator.onLine===false?"No internet — try again later.":/activat/i.test(e&&e.message||"")?"Reports aren't switched on yet. Try again later.":"That didn't send. Tap to try again.";
}
var REPORT_SUBJECT = "Game Report: Christian – Food Truck Review Shift (Precision & Models)";
var REPORT_PLAYER = "Christian (age 14)";
var REPORT_GAME = "Startup Tycoon: Food Truck Season — Review Shift";
function reviewReport() {
  var L = st.lastDone;
  var f = {
    "Report type": "Practice review shift — not credit. Exponential precision (round only at the end) and full exponential models.",
    "Shift": "Review: Keep the decimals. Write the whole model.",
    "Credit": "None. This page does not award credit.",
    "Goal": "Get all 6 problems right. Unlimited tries. No timer.",
    "Result": L.correct + " of " + NP + " correct",
    "Started": fmtTime(L.startedAt),
    "Finished": fmtTime(L.finishedAt),
    "Play": L.run > 1 ? "Practice run #" + L.run : "First completion"
  };
  PROBLEMS.forEach(function (p, i) {
    var r = L.results[i];
    var targeted = r.codes.length ? r.codes.map(codeLabel).join("; ") : "None";
    f["Q" + (i + 1) + " " + p.title] = (r.ok ? "✅ correct" : "not correct") +
      " in " + r.tries + (r.tries === 1 ? " try" : " tries") +
      " — his answer" + (r.answers.length > 1 ? "s" : "") + ": " + (r.answers.length ? r.answers.map(function (a) { return '"' + a + '"'; }).join(" then ") : "(none)") +
      " • hint opened: " + (r.hint ? "yes" : "no") +
      " • feedback flags: " + targeted +
      " • key: " + answerKey(p);
  });
  return f;
}

function bootReview() {
  app = document.getElementById("app");
  if (PREVIEW) {
    var b = document.createElement("span");
    b.id = "previewBadge";
    b.className = "tag";
    b.style.cssText = "background:#8e44ad;color:#fff";
    b.textContent = "Preview – reports off";
    document.querySelector("header").appendChild(b);
  }
  loadState();
  showHead();
  render();
}
if (typeof document !== "undefined" && document.getElementById && document.getElementById("app")) bootReview();

<style>

<body>
<header><h1>🚚 STARTUP TYCOON — Food Truck Season</h1><span class="muted" id="best"></span></header>
<main id="app"></main>
<script type="text/plain" id="game">
/* Review shift — same report sender, help panel, and expression checker as the daily shifts.
   Retry rule is the review rule: unlimited tries, and the shift clears only when every line is right.
   Save key is separate from d1–d10, tycoonBest, and tycoonLast. */
const KEY = PREVIEW ? "tycoonDailyPreview" : "tycoonDaily";
const DK = "review-rounding";
const MAX_TASKS = DAY.tasks.reduce((a,t)=>a+t.value,0);
const MAX_EVENT = 0;
const MAX_PROFIT = MAX_TASKS + MAX_EVENT;
let all; try{all=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){all={};}
let st = all[DK] || null;
function fresh(keep){ return {stage:"brief", idx:0, results:DAY.tasks.map(()=>({tries:0,ok:false,answers:[],earned:0,closed:false,hintOpen:false,note:""})), activeSec:0, startedAt:null, finishedAt:null,
  best:keep?keep.best:null, plays:keep?keep.plays:0, autoSent:keep?keep.autoSent:false, lastDone:keep?keep.lastDone:null, v:1}; }
if(!st || st.v!==1 || !Array.isArray(st.results) || st.results.length!==DAY.tasks.length) st=fresh(st && st.v?st:null);
function persist(){ all[DK]=st; try{localStorage.setItem(KEY,JSON.stringify(all));}catch(e){} showBest(); }
function money(n){ n=Math.round(n); return (n<0?"−$":"$")+Math.abs(n).toLocaleString(); }
function showBest(){
  const cleared=st.results.filter(r=>r.ok).length;
  document.getElementById("best").textContent = `Review shift · ${cleared} of ${DAY.tasks.length} clear`;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const app=document.getElementById("app");
const toTop=()=>{ try{window.scrollTo(0,0);}catch(e){} };
setInterval(()=>{ if(document.visibilityState==="visible" && st.stage==="tasks"){ st.activeSec+=5; persist(); } },5000);

/* ---------- answer checking (daily-shift checker, plus review rules) ---------- */
function clean(s){ return String(s).toLowerCase().replace(/[−–—]/g,"-").replace(/[×·]/g,"*").replace(/÷/g,"/").replace(/≥/g,">=").replace(/≤/g,"<=").replace(/=>/g,">=").replace(/=</g,"<=").replace(/\$/g,"").replace(/,/g,"").replace(/\s+/g,""); }
const SUP={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"-","⁺":"+","ᵃ":"a","ᵇ":"b","ᶜ":"c","ᵈ":"d","ᵉ":"e","ᶠ":"f","ᵍ":"g","ʰ":"h","ⁱ":"i","ʲ":"j","ᵏ":"k","ˡ":"l","ᵐ":"m","ⁿ":"n","ᵒ":"o","ᵖ":"p","ʳ":"r","ˢ":"s","ᵗ":"t","ᵘ":"u","ᵛ":"v","ʷ":"w","ˣ":"x","ʸ":"y","ᶻ":"z"};
const SUP_RE=new RegExp("["+Object.keys(SUP).join("")+"]+","g");
function normalize(raw){
  SUP_RE.lastIndex=0;
  return String(raw)
    .replace(SUP_RE, m=>"^"+[...m].map(c=>SUP[c]||"").join(""))
    .replace(/\*\*/g,"^")
    .replace(/ˆ/g,"^")
    .replace(/[{}]/g,"")
    .replace(/\.(?=\s*$)/,"");
}
function compile(expr, vars){
  if(!expr) return null;
  if(!/^[0-9.+\-*/()a-z^]+$/.test(expr)) return null;
  const letters = expr.match(/[a-z]/g)||[];
  if(letters.some(l=>!vars.includes(l))) return null;
  let e = expr.replace(/(\d|\))(?=[a-z(])/g,"$1*").replace(/([a-z])(?=[a-z0-9(])/g,"$1*").replace(/\)(?=[0-9a-z(])/g,")*").replace(/\^/g,"**").replace(/(^|\()-/g,(m,a)=>a+"0-");
  try{ const f=new Function(...vars, "return ("+e+");"); f(...vars.map(()=>1.37)); return f; }catch(err){ return null; }
}
function num(s){ const c=String(s).replace(/[−–—]/g,"-").replace(/[^0-9.\-]/g,""); if(!/\d/.test(c)) return NaN; return parseFloat(c); }
function roundTo(v, place){
  const f = 10 ** place;
  return Math.round(Number((v * f).toFixed(6))) / f;
}
const near=(a,b)=>Math.abs(a-b) <= 1e-6*Math.max(1,Math.abs(b));
function exprWhy(t,f){
  if(!(t.start>0)) return t.miss;
  let a,b,c;
  try{ a=f(0); b=f(1); c=f(2); }catch(err){ return t.miss; }
  if(!isFinite(a)||!isFinite(b)||!isFinite(c)) return t.miss;
  if(Math.abs(a-t.start) > Math.max(0.5, t.start*0.01)) return "The starting amount is off. At year 0 the value is the price you paid.";
  if(a===0) return t.miss;
  const ratio=b/a;
  if(Number.isFinite(t.loss) && Math.abs(ratio-t.loss)<0.02) return "That base is the percent you lose. Use the percent that stays: 1 minus the loss, as a decimal.";
  if(Number.isFinite(t.keep) && Math.abs(ratio-t.keep)<0.02 && Math.abs((c/b)-t.keep)>0.02) return "Year 1 matches, but every later year has to multiply by that same factor. Put the year in the exponent.";
  return t.miss;
}
function check(t, raw){
  if(t.type==="num"){
    if(!String(raw).trim()) return {empty:true};
    const v=num(raw);
    if(isNaN(v)) return {invalid:"Enter a number."};
    if(t.place!=null && roundTo(v, t.place)===roundTo(t.a, t.place)) return {ok:true};
    if(t.place==null && Math.abs(v-t.a)<=0.011) return {ok:true};
    let early="";
    if(t.traps){
      for(const tr of t.traps){
        const tol=tr.tol==null?0.02:tr.tol;
        if(Math.abs(v-tr.v)<=tol){ early=tr.msg; break; }
      }
    }
    return {ok:false, early:early||t.miss};
  }
  const s=clean(normalize(raw));
  if(!s) return {empty:true};
  if(t.type==="expr"){
    let e=s;
    if(e.includes("=")){
      const p=e.split("=");
      if(p.length!==2) return {invalid:"Use one = sign at most."};
      const lhsRe=/^[a-z](\([a-z]\))?$/;
      if(lhsRe.test(p[0]) && !t.vars.includes(p[0])) e=p[1];
      else if(lhsRe.test(p[1]) && !t.vars.includes(p[1])) e=p[0];
      else return {invalid:`Write it as ${t.prefix} (an expression in ${t.vars.join(", ")}).`};
    }
    const hasExp=/\^/.test(e);
    const f=compile(e, t.vars);
    if(!f) return {invalid:`I couldn't read that. Use numbers, ${t.vars.join(", ")}, and ^ for the exponent. A superscript is fine too.`};
    if(t.requireExp && !hasExp) return {ok:false, early:"The exponent is missing. Write the whole model, like 40000(0.85)^t."};
    const key=compile(String(t.key).replace(/\s/g,""), t.vars);
    const pts=[0,1,2.5,7,40,140,333];
    if(key && pts.every(x=>near(f(x), key(x)))) return {ok:true};
    return {ok:false, early:exprWhy(t,f)};
  }
  return {invalid:"?"};
}

/* ---------- screens ---------- */
function profitNow(){ return st.results.reduce((a,r)=>a+r.earned,0); }
function firstTry(){ return st.results.filter(r=>r.ok&&r.tries===1).length; }
function statsHTML(){
  const done=st.results.filter(r=>r.ok).length, p=profitNow();
  return `<div class="stats">
   <div class="stat"><div class="k">Shift total</div><div class="v">${money(p)}</div></div>
   <div class="stat"><div class="k">Lines cleared</div><div class="v">${done} / ${DAY.tasks.length}</div></div>
   <div class="stat"><div class="k">Right first time</div><div class="v">${firstTry()}</div></div>
   <div class="stat"><div class="k">Shift best</div><div class="v">${st.best!=null?money(st.best):"—"}</div></div></div>`;
}
function brief(){
  app.innerHTML=`<div class="panel"><span class="tag">Review · ${esc(DAY.date)}</span><h2 style="margin-top:8px">${esc(DAY.title)}</h2>
  <p class="muted">${esc(DAY.client)}</p><p>${esc(DAY.brief)}</p>
  <ul><li><b>${DAY.tasks.length} lines</b>, <b>${money(MAX_PROFIT)}</b> on the packet. It clears only when every line is right.</li>
  <li>Unlimited tries. A miss stays on that line. The answer is not shown until it's right.</li>
  <li>Every line has a hint. Open it when you want it.</li>
  <li>Calculator's fine. Write down every digit. Round once — at the end.</li></ul>
  <button onclick="startShift()">Open the books ▶</button></div>`;
}
function startShift(){ if(!st.startedAt) st.startedAt=new Date().toISOString(); st.stage="tasks"; persist(); render(); toTop(); }
function render(){ if(st.stage==="brief") return brief(); if(st.stage==="tasks") return task(); if(st.stage==="done") return done(); }
function task(){
  const i=st.idx, t=DAY.tasks[i], r=st.results[i];
  const last=r.answers[r.answers.length-1];
  let fb="";
  if(r.closed){
    fb=`<div class="note"><b class="good">✅ Booked. +${money(t.value)}</b>${r.tries>1?` <span class="muted">(${r.tries} tries)</span>`:""}<br><span class="muted">Key: ${esc(t.show)}</span></div>`;
  } else if(r.tries){
    fb=`<div class="note"><b class="bad">Not yet.</b> ${esc(r.note||t.miss)}<br><span class="muted">Unlimited tries. This line stays open until it's right.</span></div>`;
  }
  const hint=r.hintOpen?`<div class="note" id="hintbox"><b>Hint:</b> ${esc(t.hint)}</div>`:"";
  const fmt=t.type==="expr"?"Use ^ for the exponent, like 40000(0.85)^t. Spaces, commas, and a superscript t are fine.":"Type the final number. $ signs, commas, and words are fine. Round only at the end.";
  app.innerHTML=`<div class="panel">${statsHTML()}</div>
  <div class="panel"><details ${i===0&&!r.tries?"open":""}><summary style="cursor:pointer"><b>📋 Shift brief</b> <span class="muted">— tap for the story</span></summary><p>${esc(DAY.brief)}</p></details></div>
  <div class="panel" id="taskp"><span class="tag">Line ${i+1} of ${DAY.tasks.length} · ${esc(t.title)}</span>
   <p style="font-size:1.05rem">${esc(t.q)}</p>
   <div class="stake">💼 <b>On the line (${money(t.value)}):</b> ${esc(t.stake)}</div>
   ${r.closed?`<p>Your answer: <b>${esc(last||"")}</b></p>`:`<div class="row">${t.prefix?`<span class="pre">${esc(t.prefix)}</span>`:""}<input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(t.ph||"your answer")}" onkeydown="if(event.key==='Enter')commit()"><button onclick="commit()">Commit</button><button class="sec" type="button" onclick="toggleHint()">${r.hintOpen?"Hide hint":"Hint"}</button></div>
   <div class="muted" id="m" style="margin-top:6px">${fmt}</div>`}
   ${hint}
   ${fb}
   ${r.closed?`<button onclick="nextTask()">${i+1<DAY.tasks.length?"Next line ▶":"Close out the shift ▶"}</button>`:""}
  </div>`;
  const el=document.getElementById("taskp"); if(el&&(r.tries||r.closed)&&el.scrollIntoView) el.scrollIntoView({block:"start"});
  const inp=document.getElementById("ans"); if(inp&&r.tries) inp.focus();
}
function toggleHint(){
  const r=st.results[st.idx];
  const draft=document.getElementById("ans");
  const keep=draft?draft.value:"";
  r.hintOpen=!r.hintOpen;
  if(r.hintOpen) hpush(hl.hintQs, "Q"+(st.idx+1)+" "+DAY.tasks[st.idx].title);
  persist(); task();
  const inp=document.getElementById("ans");
  if(inp){ inp.value=keep; if(keep) inp.focus(); }
}
function commit(){
  const i=st.idx, t=DAY.tasks[i], r=st.results[i];
  if(r.closed) return;
  const raw=document.getElementById("ans").value.trim(), m=document.getElementById("m");
  const res=check(t,raw);
  if(res.empty) return;
  if(res.invalid){ m.className="bad"; m.textContent=res.invalid; return; }
  r.tries++; r.answers.push(raw);
  if(res.ok){ r.ok=true; r.closed=true; r.earned=t.value; r.note=""; }
  else { r.note=res.early||t.miss; }
  persist(); task();
  if(!res.ok){
    const inp=document.getElementById("ans");
    if(inp){ inp.value=raw; inp.focus(); }
  }
}
function nextTask(){
  if(!st.results[st.idx] || !st.results[st.idx].ok) return;
  if(st.idx+1<DAY.tasks.length) st.idx++; else finish();
  persist(); render(); toTop();
}
function finish(){
  if(st.results.some(r=>!r.ok)) return;
  st.stage="done"; st.finishedAt=new Date().toISOString();
  const p=profitNow(); const prevBest=st.best; st.plays=(st.plays||0)+1;
  const nb = prevBest==null || p>prevBest; if(nb) st.best=p;
  st.lastDone={profit:p, newBest:nb && prevBest!=null, prevBest, firstTry:firstTry(), activeSec:st.activeSec, startedAt:st.startedAt, finishedAt:st.finishedAt, play:st.plays,
    results:st.results.map(r=>({tries:r.tries,ok:r.ok,answers:r.answers.slice(),earned:r.earned}))};
}
function grade(){ return "Packet's clean — Rosa can resend it"; }
function mins(sec){ return `about ${Math.max(1,Math.round(sec/60))} min`; }
function ledger(L){
  return `<table class="ledger"><tr><th>#</th><th>Line</th><th>Result</th><th>P&amp;L</th></tr>${DAY.tasks.map((t,i)=>{const r=L.results[i];
   return `<tr><td>${i+1}</td><td>${esc(t.title)}</td><td>${r.ok?(r.tries===1?"✅ 1st try":"✅ try "+r.tries):"not cleared"}</td><td class="good">${money(r.earned)}</td></tr>`;}).join("")}
   <tr><th></th><th>Shift total</th><th></th><th class="good">${money(L.profit)}</th></tr></table>`;
}
function nextHTML(){
  return `<div class="nextshift">Rosa can resend the packet. The exponent stays on, and the rounding waits until the end.<br><br><a href="../">Back to the main game (Food Truck Season)</a></div>`;
}
function done(){
  const L=st.lastDone; if(!L){ st.stage="brief"; return render(); }
  app.innerHTML=`<div class="panel">${statsHTML()}</div>
  <div class="panel"><h2>🏁 Review clear — Hold the Rounding</h2>
  <p>All ${DAY.tasks.length} lines are right. Shift total: <b class="good" style="font-size:1.3rem">${money(L.profit)}</b> of ${money(MAX_PROFIT)} — <b>${grade()}</b></p>
  ${L.newBest?`<p class="good"><b>New shift best!</b> Previous: ${money(L.prevBest)}</p>`:(st.best!=null&&st.best>L.profit?`<p class="muted">Shift best: ${money(st.best)}</p>`:"")}
  <p class="muted">Right the first time: ${L.firstTry} of ${DAY.tasks.length} · Time: ${mins(L.activeSec)}</p>
  ${ledger(L)}
  ${reportBtn("shiftReport","📨 Send shift report to Mom")}
  ${nextHTML()}
  <p><button class="sec" onclick="replay()">Run this shift again</button></p></div>`;
  if(!PREVIEW && !st.autoSent){ st.autoSent=true; persist(); const b=document.querySelector("button.rep"); if(b) reportToMom(b,shiftReport); }
}
function replay(){ if(!confirm("Run this shift again? Your shift best is kept.")) return; st=fresh(st); persist(); render(); toTop(); }

/* ---- Report to Mom (FormSubmit AJAX) — same mechanism as the main games ---- */
const MOM_EMAIL="8caedc1e9653325b52b367e2e172d2a3"; // FormSubmit alias (hides Mom's address)
const REPORT_URL="https://formsubmit.co/ajax/"+MOM_EMAIL;
function nowStr(){try{return new Date().toLocaleString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"});}catch(e){return new Date().toString();}}
function fmtTime(iso){ if(!iso) return "—"; try{return new Date(iso).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"});}catch(e){return iso;} }
function postReport(fields){
 const ctl=typeof AbortController!=="undefined"?new AbortController():null;
 const t=ctl?setTimeout(()=>ctl.abort(),15000):null;
 return fetch(REPORT_URL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(fields),signal:ctl?ctl.signal:undefined})
  .then(r=>r.json().catch(()=>({success:r.ok?"true":"false",message:"HTTP "+r.status})).then(j=>{j._status=r.status;return j;}))
  .finally(()=>{if(t)clearTimeout(t);});
}
function reportBtn(builder,label,small){
 if(PREVIEW) return `<div class="report"><button type="button" class="rep${small?" small":""}" disabled>📨 Reports off (preview)</button><span class="rstat">Preview – reports off</span></div>`;
 return `<div class="report"><button type="button" class="rep${small?" small":""}" onclick="reportToMom(this,${builder})">${label}</button><span class="rstat" role="status" aria-live="polite"></span></div>`;
}
/*BACKUP_SENDER_v1*/
const MOM_MAILTO="dawnclay2011@gmail.com"; // optional real address for the Email button; empty = kid's mail app asks for it
function reportText(f){return Object.keys(f).filter(k=>k[0]!=="_").map(k=>k+": "+(typeof f[k]==="object"?JSON.stringify(f[k]):f[k])).join("\n");}
function retryReport(fields){
 const body=new URLSearchParams();Object.keys(fields).forEach(k=>body.append(k,typeof fields[k]==="object"?JSON.stringify(fields[k]):String(fields[k])));
 return fetch(REPORT_URL,{method:"POST",headers:{"Accept":"application/json"},body:body}).then(r=>r.json()).then(j=>{if(String(j.success)!=="true")throw new Error(j.message||"retry failed");return j;});
}
function formPost(fields){try{
 let fr=document.getElementById("bkFrame");if(!fr){fr=document.createElement("iframe");fr.name=fr.id="bkFrame";fr.style.display="none";document.body.appendChild(fr);}
 const fm=document.createElement("form");fm.method="POST";fm.action="https://formsubmit.co/"+MOM_EMAIL;fm.target="bkFrame";fm.style.display="none";
 Object.keys(fields).forEach(k=>{const i=document.createElement("input");i.type="hidden";i.name=k;i.value=typeof fields[k]==="object"?JSON.stringify(fields[k]):String(fields[k]);fm.appendChild(i);});
 document.body.appendChild(fm);fm.submit();setTimeout(()=>fm.remove(),5000);}catch(e){}}
function backupPanel(btn,fields){
 const host=btn.parentNode;let p=host.querySelector(".bkp");if(p)return;
 const txt=(fields._subject||"Game Report")+"\n\n"+reportText(fields);
 p=document.createElement("div");p.className="bkp";p.style.cssText="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center";
 const sub=encodeURIComponent(fields._subject||"Game Report");let b=txt;if(b.length>1800)b=b.slice(0,1800)+"\n…(cut short — tap Copy report and paste the rest)";
 const mk=(l,fn)=>{const x=document.createElement("button");x.type="button";x.className="alt small";x.textContent=l;x.onclick=fn;p.appendChild(x);return x;};
 mk("✉️ Send to Mom by email",()=>{location.href="mailto:"+MOM_MAILTO+"?subject="+sub+"&body="+encodeURIComponent(b);});
 const cp=mk("📋 Copy report",()=>{const ok=()=>{cp.textContent="Copied! ✅";};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,()=>fallbackCopy(txt,ok));else fallbackCopy(txt,ok);});

const SKIP={BUTTON:1,TEXTAREA:1,INPUT:1,SCRIPT:1,STYLE:1,SVG:1,svg:1,text:1,A:1,SELECT:1,OPTION:1,SUMMARY:1,TABLE:1};
function glossify(root){
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){ for(let p=n.parentNode;p&&p!==root;p=p.parentNode){ if(SKIP[p.nodeName]||(p.classList&&p.classList.contains("gw"))) return NodeFilter.FILTER_REJECT; } GRE.lastIndex=0; return GRE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }});
  const nodes=[]; while(tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n=>{ const f=document.createDocumentFragment(); let last=0; const s=n.nodeValue; GRE.lastIndex=0; let m;
    while((m=GRE.exec(s))){ f.appendChild(document.createTextNode(s.slice(last,m.index))); const sp=document.createElement("span"); sp.className="gw"; sp.dataset.w=m[1]; sp.textContent=m[0]; f.appendChild(sp); last=m.index+m[0].length; }
    f.appendChild(document.createTextNode(s.slice(last))); n.parentNode.replaceChild(f,n); });
}

  #helpPanel{position:fixed;inset:auto 0 0 0;max-height:75vh;overflow:auto;z-index:60;background:#fffdf5;border-top:5px solid #2a9d8f;border-radius:16px 16px 0 0;padding:14px 16px 24px;box-shadow:0 -4px 16px rgba(0,0,0,.3);display:none}

<script>
const TOTAL_DAYS = 15;
const DAY = {"day":12,"date":"Sunday, Nov 15","dateShort":"Sun, Nov 15","topic":"Shot list (media and logic)","title":"Daily Case #12: The Shot List Mix-Up","shortTitle":"The Shot List Mix-Up","era":"🌲 The Woods Movie","lengthNote":"Short case. A quick check before you film today.","intro":"Filming day at Ouabache State Park. The shot list slid out of the camera bag and got mixed up. Before anyone says action, Officer Cam checks the shot types, builds a short list with two takes each, and spots one continuity error.","closed":"The shot list is ready. Two takes for every shot. Have a good filming day.","plan":["Match five shot types to what they are for.","Build a three-shot opening and count the takes.","Spot the continuity error.","Practice two spelling words, then write your first shot."],"next":{"day":13,"title":"Tracks in the Mud","teaser":"Trees, animal tracks, and woods safety from the footage."},"help":{"hints":{"intro":"Tap Open the case file. Underlined words can be tapped for a meaning. There is no clock.","choice":"Read every answer. A wrong one stays crossed out. Use the hint sentence and try again.","order":"Tap cards to build the order. Tap a placed card to send it back. Then press Check.","match":"Match each prompt. A wrong pick is crossed out for that row only.","spell":"Tap letters to fill the boxes. Tap a box to take a letter back. The hint reveals one letter and does not change your stars.","write":"Write one to three sentences and end with a period. A yellow starter can help you begin.","civics":"Read the civics file. Say who decides the park rules, and name one rule. One to three sentences.","done":"Nice work. Your note can go to Mom. Spelling hints are in her report only."},"common":{"clue":"A fact that helps you solve a mystery.","evidence":"A clue you can show someone else."},"day":{"establishing shot":"A wide view that shows where the story happens, often the first shot.","wide shot":"A shot that shows a person from head to toe and a lot of the place around them.","medium shot":"A shot from about the waist up. Useful when people are talking.","close-up":"A shot that fills the picture with a face or a small object.","over-the-shoulder":"A shot that looks past one person's shoulder at another person.","continuity":"Keeping costumes, props, and places the same from shot to shot, unless the story changes them on purpose.","shot list":"The written plan of which shots you will film."}},"steps":[{"type":"match","reportLabel":"Shot match","title":"Match each shot to its job","q":"The bag had five shot names. Match each one to what it is for.","pairs":[{"prompt":"Establishing shot","options":["Shows where the story happens, often as the first shot","Shows a person from head to toe and a lot of the place","Shows a person from about the waist up, good for talking","Fills the picture with a face or a small clue","Looks past one person's shoulder at another person"],"a":0,"hint":"This is the shot that tells the audience WHERE they are.","why":"An establishing shot shows the place, often first."},{"prompt":"Wide shot","options":["Shows where the story happens, often as the first shot","Shows a person from head to toe and a lot of the place","Shows a person from about the waist up, good for talking","Fills the picture with a face or a small clue","Looks past one person's shoulder at another person"],"a":1,"hint":"Think head-to-toe, plus a lot of woods around the person.","why":"A wide shot shows the whole person and the place."},{"prompt":"Medium shot","options":["Shows where the story happens, often as the first shot","Shows a person from head to toe and a lot of the place","Shows a person from about the waist up, good for talking","Fills the picture with a face or a small clue","Looks past one person's shoulder at another person"],"a":2,"hint":"This one is the talking shot, from about the waist up.","why":"A medium shot is a solid choice for a conversation."},{"prompt":"Close-up","options":["Shows where the story happens, often as the first shot","Shows a person from head to toe and a lot of the place","Shows a person from about the waist up, good for talking","Fills the picture with a face or a small clue","Looks past one person's shoulder at another person"],"a":3,"hint":"The frame is full of one face or one small clue.","why":"A close-up makes a feeling or a clue impossible to miss."},{"prompt":"Over-the-shoulder","options":["Shows where the story happens, often as the first shot","Shows a person from head to toe and a lot of the place","Shows a person from about the waist up, good for talking","Fills the picture with a face or a small clue","Looks past one person's shoulder at another person"],"a":4,"hint":"The camera peeks past one person toward the other.","why":"An over-the-shoulder shot is for a conversation between two people."}],"explain":"You can save a wide shot and an over-the-shoulder shot for a talking scene later. This morning's list uses three shots.","evidence":"Five shot types are matched: establishing, wide, medium, close-up, over-the-shoulder."},{"type":"order","reportLabel":"Opening shots","title":"Build the morning shot list","q":"The morning note says: start with where we are, then the people talking, then the clue. Put these three shots in that order.","cards":[{"id":"est","text":"Establishing shot — the woods trail, so the audience knows where we are"},{"id":"med","text":"Medium shot — two people talking on the trail"},{"id":"cu","text":"Close-up — the muddy footprint clue"}],"order":["est","med","cu"],"pile":["cu","est","med"],"hint":"The first shot should show WHERE the scene is.","hint2":"Where, then the people, then the close-up of the clue.","explain":"Shot list: 1. Establishing — Take 1 and Take 2. 2. Medium — Take 1 and Take 2. 3. Close-up — Take 1 and Take 2. Each shot is filmed twice.","evidence":"Opening list: establishing, medium, close-up. Two takes on each shot."},{"type":"choice","reportLabel":"Two takes","title":"How many takes?","q":"You have 3 shots, and each shot gets 2 takes. How many takes will you film?","options":["3 takes","5 takes","6 takes","8 takes"],"a":2,"hint":"Multiply the number of shots by 2.","explain":"3 shots times 2 takes is 6 takes. A take is one filmed try. You can do them calmly. There is no clock on this case.","evidence":"Plan: 6 takes for the opening (3 shots, 2 takes each)."},{"type":"choice","reportLabel":"Continuity","title":"Spot the continuity error","q":"Frame 1: the red cap is on, the map is in the left hand, and an oak leaf is stuck to the right sleeve. Frame 2 is supposed to match. Which note is a continuity error?","options":["The oak leaf is still on the right sleeve.","The cap is gone and the map jumped to the right hand.","The trees are still behind him.","The shoes are the same color."],"a":1,"hint":"A continuity error is a change you did not mean. Which note says something moved or vanished?","explain":"If the cap disappears and the map switches hands, viewers notice. Use another take that matches Frame 1, or show a story reason for the change.","evidence":"Continuity error: the cap vanished and the map switched hands."},{"type":"spell","reportLabel":"Spelling","title":"Spelling practice","q":"Two filming words. Hints are free, and they do not change your stars.","words":[{"word":"camera","given":[true,false,true,false,true,true],"prompt":"Fill in the machine that records the shots. Some letters are locked."},{"word":"director","prompt":"Unscramble the person who chooses the shots."}],"explain":"Spelling is practice. Your stars come from the clues, not from these words."},{"type":"write","reportLabel":"First shot","field":"report","title":"Your first shot","q":"In one to three sentences, what is the first shot you will film today, and why?","starters":["The first shot I will film is ","I am starting with that shot because "],"placeholder":"The first shot I will film is ","explain":""}]};
const KEY = "ocamDaily";
const DK = "d" + DAY.day;
const HKEY = "ocamHelp";
const PTS = {first:10, second:6, later:3, write:20};

let all; try { all = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { all = {}; }
let st = all[DK] || null;

function emptyAnswer(step) {
  if (step.type === "choice") return { tries: 0, ok: false, picked: [] };
  if (step.type === "order") return { tries: 0, ok: false, placed: [], pool: (step.pile || []).slice() };
  if (step.type === "match") return { tries: 0, ok: false, rows: step.pairs.map(function () { return { ok: false, picked: [] }; }) };
  if (step.type === "spell") return { tries: 0, ok: false, words: step.words.map(initWord), msg: "" };
  if (step.type === "write") return { tries: 0, ok: false, text: "" };
  return { tries: 0, ok: false };
}
function fresh(keep) {
  return {
    v: 1, stage: "intro", step: 0,
    answers: DAY.steps.map(emptyAnswer),
    report: "", civics: "", proud: "",
    activeSec: 0, startedAt: null, finishedAt: null,
    score: 0, stars: 0,
    best: keep && keep.best ? keep.best : 0,
    plays: keep && keep.plays ? keep.plays : 0,
    autoSent: !!(keep && keep.autoSent),
    lastDone: keep && keep.lastDone ? keep.lastDone : null
  };
}
function saveOk(s) {
  return !!(s && s.v === 1 && Array.isArray(s.answers) && s.answers.length === DAY.steps.length);
}
if (!saveOk(st)) st = fresh(st);
function persist() {
  all[DK] = st;
  try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) {}
  badge();
}
function badge() {
  var el = document.getElementById("rank");
  if (el) el.textContent = "Day " + DAY.day + " of " + TOTAL_DAYS + " • " + DAY.dateShort;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
const app = document.getElementById("app");
function toTop() { try { window.scrollTo(0, 0); } catch (e) {} }
setInterval(function () {
  if (document.visibilityState === "visible" && st.stage === "play") { st.activeSec += 5; persist(); }
}, 5000);

function caseHeader(compact) {
  var body = compact
    ? "<details><summary class=\"hint\">Re-read the case story</summary><p>" + esc(DAY.intro) + "</p></details>"
    : "<p>" + esc(DAY.intro) + "</p>";
  return "<div class=\"card file\"><span class=\"era\">" + esc(DAY.era) + "</span><h2>" + esc(DAY.title) + "</h2>" + body + "</div>";
}
function peopleHTML() {
  if (!DAY.storyPeople) return "";
  return "<div class=\"card\"><h2>Story file</h2><p class=\"storynote\">" + esc(DAY.storyNote) + "</p><div class=\"grid\">" +
    DAY.storyPeople.map(function (s) {
      return "<div class=\"suspect\"><div class=\"face\">" + esc(s.face) + "</div><b>" + esc(s.name) + "</b><div class=\"role\">" + esc(s.role) + "</div><p>" + esc(s.note) + "</p></div>";
    }).join("") + "</div></div>";
}
function evidenceHTML() {
  var ev = [];
  DAY.steps.forEach(function (step, i) {
    if (step.evidence && st.answers[i] && st.answers[i].ok) ev.push(step.evidence);
  });
  var total = DAY.steps.filter(function (s) { return !!s.evidence; }).length;
  return "<div class=\"card\"><h2>Evidence board (" + ev.length + "/" + total + ")</h2><ul class=\"evidence\">" +
    (ev.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") || "<li class='hint'>No evidence yet. Work the first clue.</li>") +
    "</ul></div>";
}
function sourcesHTML() {
  if (!DAY.sources || !DAY.sources.length) return "";
  return "<div class=\"card sources\"><h2>Case sources</h2><ul>" + DAY.sources.map(function (s) {
    return "<li><a href=\"" + esc(s.url) + "\" target=\"_blank\" rel=\"noopener\">" + esc(s.label) + "</a></li>";
  }).join("") + "</ul>" + (DAY.sourceNote ? "<p>" + esc(DAY.sourceNote) + "</p>" : "") + "</div>";
}
function stationLink() {
  return "<p><a href=\"../\">⬅ Station home</a></p>";
}

function intro() {
  helpStage = "intro";
  var items = DAY.plan.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("");
  app.innerHTML = caseHeader(false) + peopleHTML() +
    "<div class=\"card\"><h2>Today's assignment, Officer Cam 👮</h2>" +
    "<p>📅 <b>" + esc(DAY.date) + "</b> — <b>" + esc(DAY.topic) + "</b></p>" +
    "<p>" + esc(DAY.lengthNote) + "</p><ol>" + items + "</ol>" +
    "<p>Wrong answers get a hint. You can try again. There is no clock.</p>" +
    "<button type=\"button\" id=\"openBtn\" onclick=\"startCase()\">🔎 Open the case file</button></div>" +
    sourcesHTML();
}
function startCase() {
  if (!st.startedAt) st.startedAt = new Date().toISOString();
  st.stage = "play";
  persist();
  render();
  toTop();
}
function goIntro() { st.stage = "intro"; persist(); render(); toTop(); }

let helpStage = "intro";
function render() {
  if (st.stage === "intro") return intro();
  if (st.stage === "done") return doneScreen();
  return stepScreen();
}
function stepScreen() {
  var step = DAY.steps[st.step];
  var rec = st.answers[st.step];
  if (!step || !rec) {
    st.step = 0;
    st.stage = st.lastDone ? "done" : "intro";
    persist();
    return render();
  }
  helpStage = step.type === "write" && step.field === "civics" ? "civics" : step.type;
  var body = "";
  if (step.type === "choice") body = choiceHTML(step, rec);
  else if (step.type === "order") body = orderHTML(step, rec);
  else if (step.type === "match") body = matchHTML(step, rec);
  else if (step.type === "spell") body = spellHTML(step, rec);
  else if (step.type === "write") body = writeHTML(step, rec);
  app.innerHTML = caseHeader(true) + peopleHTML() + evidenceHTML() +
    "<div class=\"card\" id=\"cluecard\"><p class=\"hint\">Part " + (st.step + 1) + " of " + DAY.steps.length + "</p>" + body + "</div>" +
    "<p><button type=\"button\" class=\"alt\" onclick=\"goIntro()\">⬅ Back to case cover</button></p>" +
    stationLink() + sourcesHTML();
  if (step.type === "write") onWrite();
  var el = document.getElementById("cluecard");
  if (el && el.scrollIntoView && st.step > 0) el.scrollIntoView({ block: "start" });
}
function nextLabel() {
  if (st.step + 1 >= DAY.steps.length) return "Close the case ▶";
  var n = DAY.steps[st.step + 1];
  if (n.type === "write" && n.field === "civics") return "Open the court file ▶";
  if (n.type === "write") return "Write your note ▶";
  return "Next ▶";
}
function nextBlock(step) {
  if (!step.explain) return "<button type=\"button\" id=\"nextBtn\" onclick=\"nextStep()\">" + nextLabel() + "</button>";
  return "<div class=\"factfile\"><b>Fact file:</b> " + esc(step.explain) + "</div><button type=\"button\" id=\"nextBtn\" onclick=\"nextStep()\">" + nextLabel() + "</button>";
}
function nextStep() {
  if (st.answers[st.step]) st.answers[st.step].ok = true;
  st.step++;
  if (st.step >= DAY.steps.length) { st.stage = "done"; finish(); }
  persist();
  render();
  toTop();
}

function choiceHTML(step, rec) {
  var opts = step.options.map(function (o, j) {
    var cls = rec.ok && j === step.a ? "right" : (rec.picked.indexOf(j) >= 0 ? "wrong" : "");
    var dis = rec.ok || rec.picked.indexOf(j) >= 0 ? " disabled" : "";
    return "<button type=\"button\" class=\"opt " + cls + "\"" + dis + " onclick=\"pickOpt(" + j + ")\">" +
      String.fromCharCode(65 + j) + ". " + esc(o) + "</button>";
  }).join("");
  var msg = !rec.ok && rec.picked.length ? "<p class=\"bad\">Not quite, Officer. " + esc(step.hint) + " You can try again.</p>" : "";
  return "<h2>" + esc(step.title) + "</h2><p>" + esc(step.q) + "</p>" + opts + msg + (rec.ok ? nextBlock(step) : "");
}
function pickOpt(j) {
  var step = DAY.steps[st.step], rec = st.answers[st.step];
  if (!step || step.type !== "choice" || rec.ok || rec.picked.indexOf(j) >= 0) return;
  rec.picked.push(j);
  rec.tries++;
  if (j === step.a) rec.ok = true;
  persist();
  stepScreen();
}

function cardText(step, id) {
  for (var i = 0; i < step.cards.length; i++) if (step.cards[i].id === id) return step.cards[i].text;
  return id;
}
function orderHTML(step, rec) {
  var pool = rec.pool.map(function (id) {
    return "<button type=\"button\" class=\"opt\" data-card-id=\"" + esc(id) + "\" onclick=\"orderAdd('" + id + "')\">" + esc(cardText(step, id)) + "</button>";
  }).join("") || "<p class=\"hint\">All cards are in your order.</p>";
  var placed = rec.placed.map(function (id, i) {
    return "<button type=\"button\" class=\"opt" + (rec.ok ? " right" : "") + "\" data-placed=\"" + i + "\" onclick=\"orderRemove(" + i + ")\">" + (i + 1) + ". " + esc(cardText(step, id)) + "</button>";
  }).join("") || "<p class=\"hint\">Tap a card to put it first.</p>";
  var msg = "";
  if (!rec.ok && rec.tries) {
    msg = "<p class=\"bad\">Not quite. " + esc(step.hint) + (rec.tries >= 2 ? " " + esc(step.hint2 || "") : "") + " Tap a placed card to send it back, then try again.</p>";
  }
  var check = rec.ok ? "" : "<button type=\"button\" id=\"orderCheck\" onclick=\"orderCheck()\">Check this order</button>";
  return "<h2>" + esc(step.title) + "</h2><p>" + esc(step.q) + "</p>" +
    "<h3>Cards</h3>" + pool + "<h3>Your order</h3>" + placed + check + msg + (rec.ok ? nextBlock(step) : "");
}
function orderAdd(id) {
  var rec = st.answers[st.step];
  if (!rec || rec.ok) return;
  var p = rec.pool.indexOf(id);
  if (p < 0) return;
  rec.pool.splice(p, 1);
  rec.placed.push(id);
  persist();
  stepScreen();
}
function orderRemove(index) {
  var rec = st.answers[st.step];
  if (!rec || rec.ok) return;
  var id = rec.placed.splice(index, 1)[0];
  if (id) rec.pool.push(id);
  persist();
  stepScreen();
}
function orderCheck() {
  var step = DAY.steps[st.step], rec = st.answers[st.step];
  if (!rec || rec.ok) return;
  if (rec.placed.length !== step.order.length) {
    rec.msg = "short";
    var m = document.getElementById("m");
    if (!m) {
      var host = document.getElementById("cluecard");
      if (host) {
        var d = document.createElement("p");
        d.id = "m"; d.className = "bad";
        d.textContent = "Place every card, then check.";
        host.appendChild(d);
      }
    }
    return;
  }
  rec.tries++;
  var good = rec.placed.every(function (id, i) { return id === step.order[i]; });
  if (good) rec.ok = true;
  persist();
  stepScreen();
}

function matchHTML(step, rec) {
  var rows = step.pairs.map(function (pair, ri) {
    var r = rec.rows[ri];

    var bits = step.pairs.map(function (pair, ri) {
      var r = rec.rows[ri];
      var pick = r.picked.map(function (j) { return pair.options[j]; }).join(" | ");
      return pair.prompt + " → picked [" + pick + "] correct [" + pair.options[pair.a] + "]";
    }).join(" || ");
    return bits + " || " + (firstTry(step, rec) ? "first try" : rec.tries + " wrong taps before it was done");
  }
  if (step.type === "spell") {
    return step.words.map(function (spec, wi) { return spellingHow(spec, rec.words[wi]); }).join(" || ");
  }
  if (step.type === "write") {
    var text = rec.text || "";
    return "Prompt: " + step.q + " || Cam wrote: " + text + " || " + words(text) + " words, " + sentences(text) + " sentences";
  }
  return "";
}
function caseReport() {
  var L = st.lastDone;
  var f = {
    "Report type": "Woods Movie Case File — Day " + DAY.day + " of " + TOTAL_DAYS,
    "Day & topic": "Day " + DAY.day + " (" + DAY.date + ") — " + DAY.topic,
    "Case": DAY.title,
    "Theme": "The Woods Movie Case Files",
    "Length": DAY.lengthNote,
    "Solved": "Yes ✅",
    "Score": L.score + " of " + L.max + " (" + "⭐".repeat(L.stars) + " " + L.stars + " of 3)" + (L.best > L.score ? " — best on this case: " + L.best : ""),
    "Clues right on first try": L.firstTry + " of " + L.graded + " (spelling practice is not scored)",
    "Time on case": mins(L.activeSec) + " of active time (started " + fmtTime(L.startedAt) + ", finished " + fmtTime(L.finishedAt) + ")",
    "Play": L.play > 1 ? "Replay #" + L.play : "First play"
  };
  DAY.steps.forEach(function (step, i) {
    f["Answer " + pad(i + 1) + " — " + step.reportLabel] = answerLine(step, L.answers[i]);
  });
  var spellBits = [];
  DAY.steps.forEach(function (step, i) {
    if (step.type !== "spell") return;
    step.words.forEach(function (spec, wi) { spellBits.push(spellingHow(spec, L.answers[i].words[wi])); });
  });
  f["Spelling (no penalty, Mom note)"] = spellBits.join(" | ");
  if (DAY.steps.some(function (s) { return s.field === "civics"; })) {
    var cq = DAY.steps.filter(function (s) { return s.field === "civics"; })[0];
    f["Civics question"] = cq.q;
    f["Cam's civics answer"] = L.civics || "";
  }
  var wstep = DAY.steps.filter(function (s) { return s.type === "write" && s.field !== "civics"; })[0];
  var wtext = (wstep && wstep.field === "proud") ? (L.proud || "") : (L.report || "");
  f["Written prompt"] = wstep ? wstep.q : "";
  f["Cam's written response"] = wtext;
  f["Report length"] = words(wtext) + " words, " + sentences(wtext) + " sentences";
  f["Help words looked up"] = hl.words.length ? hl.words.join(", ") : "None";
  f["Help button opened"] = hl.hints + (hl.hints === 1 ? " time" : " times");
  return f;
}

const HELPDATA = DAY.help;
let HLOG; try { HLOG = JSON.parse(localStorage.getItem(HKEY) || "{}") || {}; } catch (e) { HLOG = {}; }
const hl = HLOG[DK] || (HLOG[DK] = { words: [], hints: 0 });
function hsave() { try { localStorage.setItem(HKEY, JSON.stringify(HLOG)); } catch (e) {} }
hsave();
const GLOSS = Object.assign({}, HELPDATA.common || {}, HELPDATA.day || {});
const GKEYS = Object.keys(GLOSS).sort(function (a, b) { return b.length - a.length; });
const GRE = new RegExp("\\b(" + GKEYS.map(function (k) { return k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")(s|es)?\\b", "gi");
function gfind(w) {
  w = w.toLowerCase();
  return GKEYS.filter(function (k) { return k.toLowerCase() === w; })[0] ||
    GKEYS.filter(function (k) { return w === k.toLowerCase() + "s" || w === k.toLowerCase() + "es"; })[0];
}
function logWord(k) { if (hl.words.indexOf(k) < 0) { hl.words.push(k); hsave(); } }
(function () {
  var b = document.createElement("button");
  b.id = "helpBtn"; b.type = "button"; b.textContent = "❓ Help"; b.onclick = openHelp;
  var header = document.querySelector("header");
  if (header) header.appendChild(b);
  else document.body.appendChild(b);
  var p = document.createElement("div");
  p.id = "helpPanel"; p.setAttribute("role", "dialog");
  document.body.appendChild(p);
  var w = document.createElement("div");
  w.id = "wordPop"; w.onclick = function () { w.style.display = "none"; };
  document.body.appendChild(w);
})();
function openHelp() {
  var p = document.getElementById("helpPanel");
  var step = st.stage === "play" ? DAY.steps[st.step] : null;
  var hint = (step && step.help) || (HELPDATA.hints && HELPDATA.hints[helpStage]) || "";
  var dayKeys = Object.keys(HELPDATA.day || {});
  var comKeys = Object.keys(HELPDATA.common || {});
  p.innerHTML = "<button type=\"button\" class=\"alt\" style=\"float:right;width:auto\" onclick=\"closeHelp()\">✖ Close</button>" +
    "<h3>🆘 Help, Officer Cam</h3><div class=\"hint\">💡 <b>Hint:</b> " + esc(hint) + "</div>" +
    "<h3>📖 Today's words</h3><dl>" + dayKeys.map(function (k) { return "<dt>" + esc(k) + "</dt><dd>" + esc(GLOSS[k]) + "</dd>"; }).join("") + "</dl>" +
    "<h3>🕵️ Detective words</h3><dl>" + comKeys.map(function (k) { return "<dt>" + esc(k) + "</dt><dd>" + esc(GLOSS[k]) + "</dd>"; }).join("") + "</dl>";
  p.style.display = "block";
  hl.hints++;
  hsave();
}
function closeHelp() { document.getElementById("helpPanel").style.display = "none"; }
function showWord(k) {
  var w = document.getElementById("wordPop");
  w.innerHTML = "<b>" + esc(k) + "</b>: " + esc(GLOSS[k]) + " <span style=\"opacity:.7\">(tap to close)</span>";
  w.style.display = "block";
  logWord(k);
}
document.addEventListener("click", function (e) {
  var g = e.target.closest && e.target.closest(".gw");
  if (!g) return;
  e.preventDefault();
  e.stopPropagation();
  var k = gfind(g.dataset.w) || g.dataset.w;
  if (GLOSS[k]) showWord(k);
}, true);
var SKIP = { BUTTON: 1, TEXTAREA: 1, INPUT: 1, SCRIPT: 1, STYLE: 1, SVG: 1, A: 1, SELECT: 1, OPTION: 1 };
function glossify(root) {
  if (!GKEYS.length) return;
  var tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: function (n) {
    for (var p = n.parentNode; p && p !== root; p = p.parentNode) {
      if (SKIP[p.nodeName] || (p.classList && p.classList.contains("gw"))) return NodeFilter.FILTER_REJECT;
    }
    GRE.lastIndex = 0;
    return GRE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
  } });
  var nodes = [];
  while (tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(function (n) {
    var f = document.createDocumentFragment();
    var last = 0, s = n.nodeValue, m;
    GRE.lastIndex = 0;
    while ((m = GRE.exec(s))) {
      f.appendChild(document.createTextNode(s.slice(last, m.index)));
      var sp = document.createElement("span");
      sp.className = "gw"; sp.dataset.w = m[1]; sp.textContent = m[0];
      f.appendChild(sp);
      last = m.index + m[0].length;
    }
    f.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(f, n);
  });
}
var gObs = new MutationObserver(function () {
  gObs.disconnect();
  try { glossify(app); } catch (e) {}
  gObs.observe(app, { childList: true, subtree: true });
});
gObs.observe(app, { childList: true, subtree: true });
badge();
render();

</script>
